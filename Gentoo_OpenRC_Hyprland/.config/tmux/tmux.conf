# ~/.tmux.conf ÔÇö Jarvis
# Configura├º├úo com workflow inspirado no i3 (tiling window manager).
# Copiar para ~/.tmux.conf no Jarvis.
#
# Mapeamento conceitual i3 -> tmux:
#   i3 "workspace"  -> tmux "window"
#   i3 "container"  -> tmux "pane"
#   i3 Mod key      -> tmux prefix (Ctrl+a)

# --- Prefixo (equivalente ao "Mod" do i3) ---
# Ctrl+b ├® o padr├úo, mas conflita com outros programas de terminal.
# Trocando para Ctrl+a (mais acess├¡vel, mesmo padr├úo do screen).
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Comportamento geral ---
set -g mouse on              # permite usar o mouse pra selecionar painel/redimensionar/scroll
set -g history-limit 10000   # mais linhas de hist├│rico por painel
set -g base-index 1          # janelas (workspaces) come├ºam em 1, n├úo em 0
setw -g pane-base-index 1
set -g renumber-windows on   # renumera janelas automaticamente ao fechar uma no meio
set -sg escape-time 0        # remove delay ao apertar Esc (├║til pra quem usa vim)
set -g focus-events on       # repassa eventos de foco pros programas dentro do painel

# --- Integração com o terminal (foot) ---
# set-clipboard on: além de mandar as seleções do tmux pro clipboard do sistema
# via OSC 52, aceita que os apps DENTRO do painel também o façam (nvim, etc.).
# O default do tmux 3.5+ é "external", que ignora o OSC 52 vindo dos apps.
set -g set-clipboard on

# extended-keys on: deixa o app no painel pedir os modos 1/2 do modifyOtherKeys,
# diferenciando Shift+Enter, Ctrl+Enter, Ctrl+Shift+letra etc. (nvim/helix).
set -s extended-keys on

# usstyle: o tmux 3.6 detecta o foot, mas não sabe que ele suporta estilo de
# sublinhado; sem isso o undercurl (diagnósticos do nvim) vira underline simples.
# O if-shell evita empilhar a mesma entrada a cada "prefix + r".
if-shell -F '#{m:*usstyle*,#{terminal-features}}' '' 'set -as terminal-features "foot:usstyle"'

# =========================================================
# TILING ÔÇö divis├úo de pain├®is (equivalente ao split do i3)
# =========================================================
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"   # like i3 "splith" (Mod+h)
bind - split-window -v -c "#{pane_current_path}"   # like i3 "splitv" (Mod+v)

# --- Novo workspace (janela) ÔÇö equivalente a Mod+Enter (abrir terminal) no i3 ---
bind Enter new-window -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"        # mantido por compatibilidade

# =========================================================
# NAVEGA├ç├âO ÔÇö foco entre pain├®is, vim/i3-like (h j k l)
# =========================================================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Mover o painel focado (equivalente a Mod+Shift+h/j/k/l no i3) ---
bind H swap-pane -s '{left-of}'
bind J swap-pane -s '{down-of}'
bind K swap-pane -s '{up-of}'
bind L swap-pane -s '{right-of}'

# =========================================================
# COPY MODE — navegação e seleção estilo Vim
# =========================================================
setw -g mode-keys vi

# Entrar no copy mode
bind [ copy-mode

# Scroll
bind -T copy-mode-vi PageUp   send-keys -X page-up
bind -T copy-mode-vi PageDown send-keys -X page-down

# Navegação
bind -T copy-mode-vi h send-keys -X cursor-left
bind -T copy-mode-vi j send-keys -X cursor-down
bind -T copy-mode-vi k send-keys -X cursor-up
bind -T copy-mode-vi l send-keys -X cursor-right

# Seleção visual
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line

# Copiar
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Histórico
bind -T copy-mode-vi g send-keys -X start-of-history
bind -T copy-mode-vi G send-keys -X end-of-history

# Sair
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel
# =========================================================
# LAYOUTS ÔÇö equivalente aos layouts do i3 (splith/splitv/tabbed/stacking)
# =========================================================
bind e select-layout even-horizontal   # i3 "splith" layout
bind E select-layout even-vertical     # i3 "splitv" layout
bind t select-layout tiled             # grade ÔÇö todos os pain├®is vis├¡veis
bind m select-layout main-vertical     # um painel principal + coluna lateral (i3 "master/stack")
# Espa├ºo (default do tmux) j├í cicla entre todos os layouts dispon├¡veis

# =========================================================
# FULLSCREEN / ZOOM ÔÇö equivalente a Mod+f (fullscreen) no i3
# =========================================================
bind f resize-pane -Z

# =========================================================
# RESIZE MODE ÔÇö equivalente ao "resize mode" do i3 (Mod+r)
# Entra no modo, usa h/j/k/l repetidamente sem precisar do prefixo de novo,
# sai com Escape ou Enter.
# =========================================================
bind R switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize Enter  switch-client -T root

# =========================================================
# FECHAR ÔÇö equivalente a Mod+Shift+q (kill window) no i3
# =========================================================
bind x kill-pane
bind X kill-window

# --- Recarregar config sem reiniciar sess├úo (equivalente a Mod+Shift+r no i3) ---
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config recarregada"

# =========================================================
# BARRA DE STATUS ÔÇö equivalente ├á i3bar
# =========================================================
set -g status-style bg=black,fg=white
set -g status-left "#[fg=green,bold]#S #[fg=white]| "        # nome da sess├úo
set -g status-left-length 20
set -g status-right "#[fg=cyan]#{pane_title} #[fg=yellow]%d/%m %H:%M"
set -g status-interval 5
# Lista de janelas no estilo "workspaces" do i3: n├║mero + nome
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style bg=blue,fg=white,bold
