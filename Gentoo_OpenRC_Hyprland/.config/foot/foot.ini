# -*- conf -*-
# foot.ini - migrado de kitty (kitty.conf + current-theme.conf Adwaita darker)
# Gerado em 2026-09-22
#
# Origem kitty:
#   font_family Iosevka Nerd Font, font_size 14.0
#   shell tmux new-session -A -s main
#   confirm_os_window_close 0 (foot não confirma por padrão, sem equivalente necessário)
#   tema: Adwaita darker

# [main] é a seção padrão, pode ficar sem cabeçalho
shell=tmux new-session -A -s main
font=Iosevka Nerd Font:size=14
# Mantém tamanho físico igual ao kitty em monitores HiDPI.
# foot padrão é dpi-aware=no. Se achar a fonte grande/pequena demais, troque para no.
dpi-aware=yes

# kitty: window_padding_width 0, window_margin_width 0
pad=0x0

# kitty usa TERM=xterm-kitty, foot usa TERM=foot por padrão.
# Mantenha foot para ter todos os recursos. Se algum servidor SSH remoto
# reclamar de "unknown terminal", instale o terminfo lá ou troque para:
# term=xterm-256color
term=foot

[scrollback]
# kitty padrão: scrollback_lines 2000. foot padrão: 1000.
lines=2000
multiplier=3.0
indicator-position=relative
indicator-format=""

[cursor]
style=block
# kitty cursor_shape_unfocused hollow approximated:
# foot não tem hollow, 'unchanged' é o mais próximo que mantém visível.
# Use 'none' se preferir esconder quando desfocado.
unfocused-style=unchanged
blink=no
beam-thickness=1.5

[mouse]
# kitty: mouse_hide_wait 3.0 (padrão). foot só tem hide ao digitar.
hide-when-typing=yes
alternate-scroll-mode=yes

[colors]
# Adwaita darker (de current-theme.conf)
# kitty usa #RRGGBB, foot usa RRGGBB sem '#'
foreground=deddda
background=000000

# kitty: selection_foreground #c0bfbc, selection_background #1c1c1c
selection-foreground=c0bfbc
selection-background=1c1c1c

# kitty: cursor #deddda, cursor_text_color #000000
# foot formato: cursor=<texto> <cursor>
cursor=000000 deddda

# kitty: url_color #1a5fb4 -> cor do sublinhado das URLs no modo URL
urls=1a5fb4

## Normal/regular colors (color0-7 do kitty)
regular0=000000  # black
regular1=ed333b  # red
regular2=57e389  # green
regular3=ff7800  # yellow
regular4=62a0ea  # blue
regular5=9141ac  # magenta
regular6=5bc8af  # cyan
regular7=deddda  # white

## Bright colors (color8-15 do kitty)
bright0=9a9996   # bright black
bright1=f66151   # bright red
bright2=8ff0a4   # bright green
bright3=ffa348   # bright yellow
bright4=99c1f1   # bright blue
bright5=dc8add   # bright magenta
bright6=93ddc2   # bright cyan
bright7=f6f5f4   # bright white

# Mantém indicador/searchbox coerentes com o tema escuro
# Padrões do foot já são black-on-yellow/blue/red, ok manter default.
# Descomente se quiser forçar:
# selection-foreground=c0bfbc
# search-box-no-match=000000 ed333b
# search-box-match=000000 ffa348
# jump-labels=000000 ffa348
# scrollback-indicator=000000 99c1f1

[csd]
# kitty: hide_window_decorations no (padrão) -> deixa o compositor decidir
preferred=server

[key-bindings]
# foot já tem Ctrl+Shift+c/v, Ctrl+Shift+r, etc. como o kitty.
# Mantido default. Descomente para explicitar se quiser:
# clipboard-copy=Control+Shift+c XF86Copy
# clipboard-paste=Control+Shift+v XF86Paste
# font-increase=Control+plus Control+equal Control+KP_Add
# font-decrease=Control+minus Control+KP_Subtract

